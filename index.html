<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="proyect">
        
        <div class="topbar">
            <img src="./assets/charactercounter.png" alt="imagen del logo">
        <h1>Character Counter</h1> 
        <button><img src="./assets/config2.png" alt="imagen de configuracion"></button>    
        </div>
        
        <div class="introduction">
            <h2>Analyze your text</h2>
            <h2>in real-time.</h2>
        </div>

        <div class="text">
            <textarea name="textarea" placeholder="Put your text here"></textarea>
            <div class="input">
                <div class="inputs">
                    <div><input type="checkbox" name="Exclude Spaces"> 
                        <span>Exclude Spaces</span>
                    </div>
                <div>
                    <input type="checkbox" name="Set Character Limit"> 
                    <span>Set Character Limit</span>
                </div>
                </div>

                 <div class="Approx">
                    <p>Approx. reading time: <1 minute </p>
                </div>
            </div>
       
        </div>
        
        <div class="results">
            <div class="result1">
                <p class="result1Number">278</p>
                <p class="totalCharacters">Total Characters</p>
            </div>
            <div class="result2">
                <p class="result2Number">39</p>
                <p class="wordCount">Word Count</p>
            </div>
            <div class="result3">
                <p class="result3Number">04</p>
                <p class="sentenceCount">Sentence Count</p>
            </div>
        </div>
        
       
        <div class="metrics">
            <h3>Letter Density</h3>
            <div class="r1">
                <p class="letra1">E</p>
                <progress value="40" max="100"></progress>
                <p class="percent1">40(16.06%)</p>
            </div>
            <div class="r2">
                <p class="letra2">I</p>
                <progress value="29" max="100"></progress>
                <p class="percent2">29(11.65%)</p>
            </div>
            <div class="r3">
                <p class="letra3">T</p>
                <progress value="28" max="100"></progress>
                <p class="percent3">28(11.24%)</p>
            </div>
            <div class="r4">
                <p class="letra4">O</p>
                <progress value="22" max="100"></progress>
                <p class="percent4">22(8.84%)</p>
            </div>
            <div class="r5">
                <p class="letra5">N</p>
                <progress value="21" max="100"></progress>
                <p class="percent5">21(8.43%)</p>
            </div>
       </div>
        <div class="seemore">
            <p>See more</p>
            <details>
    
                <summary></summary>
            </details>
        </div>
    </section>
</body>
</html>
