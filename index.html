<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="proyect">
        
        <div class="topbar">
            <img src="./assets/charactercounter.png" alt="imagen del logo">
        <h1>Character Counter</h1> 
        <button>a</button>    
        </div>
        
        <div class="introduction">
            <h2>Analyze your text</h2>
            <h2>in real-time.</h2>
        </div>

        <div class="text">
            <textarea name="textarea" placeholder="Put your text here"></textarea>
            <div class="input">
                <div class="inputs">
                    <div><input type="checkbox" name="Exclude Spaces"> 
                        <span>Exclude Spaces</span>
                    </div>
                <div>
                    <input type="checkbox" name="Set Character Limit"> 
                    <span>Set Character Limit</span>
                </div>
                </div>

                 <div class="Approx">
                    <p>Approx. reading time: <1 minute </p>
                </div>
            </div>
       
        </div>
        
        <div class="results">
            <div class="result1">
                <p>278</p>
                <p>Total Characters</p>
            </div>
            <div class="result2">
                <p>39</p>
                <p>Word Count</p>
            </div>
            <div class="result3">
                <p>04</p>
                <p>Sentence Count</p>
            </div>
        </div>
        
        <h3>Letter Density</h3>
        <div class="metrics">
            <div>
                <p>E</p>
                <progress></progress>
                <p>40(16.06%)</p>
            </div>
            <div>
                <p>I</p>
                <progress></progress>
                <p>29(11.65%)</p>
            </div>
            <div>
                <p>T</p>
                <progress></progress>
                <p>28(11.24%)</p>
            </div>
            <div>
                <p>O</p>
                <progress></progress>
                <p>22(8.84%)</p>
            </div>
            <div>
                <p>N</p>
                <progress></progress>
                <p>21(8.43%)</p>
            </div>
       </div>
        
    </section>
</body>
</html>
