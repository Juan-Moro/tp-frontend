<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section>
        
        <section id="topbar">
            <h1>Character Counter</h1>
            <button></button>
        </section>
        
        <section id="introduction">
            <h2>Analyze your text</h2>
            <h2>in real-time.</h2>
        </section>

        <section id="textarea">
            <textarea name="textarea" placeholder="Put your text here"></textarea>
            <div>
                <input type="checkbox" name="Exclude Spaces"> Exclude Spaces
                <input type="checkbox" name="Set Character Limit"> Set Character Limit
                <p>Approx. reading time: <1 minute </p>

            </div>
        
        </section>
        
        <section id="results">
            <div>
                <p>278</p>
                <p>Total Characters</p>
            </div>
            <div>
                <p>39</p>
                <p>Word Count</p>
            </div>
            <div>
                <p>04</p>
                <p>Sentence Count</p>
            </div>
        </section>
    </section>
</body>
</html>
